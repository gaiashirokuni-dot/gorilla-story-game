<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>KUNIO STORY V2.0.2｜今日は俺に任せる？</title>
  <meta name="description" content="くにおとの一日を選択肢で進める、実写ADVノベルゲーム。">
  <link rel="stylesheet" href="./style.css?v=2.0.2">
</head>
<body>
  <div id="game" class="game-shell">
    <div id="backdrop" class="backdrop"></div>

    <div id="standingLayer" class="standing-layer" hidden>
      <img id="standingImage" class="standing-image" alt="くにお">
    </div>

    <div id="shade" class="screen-shade"></div>
    <div id="flash" class="flash"></div>
    <div id="chapterCurtain" class="chapter-curtain" hidden></div>
    <div id="systemAlert" class="system-alert"></div>

    <header class="topbar">
      <div id="brand" class="brand">KUNIO STORY</div>
      <div class="top-actions">
        <div id="gorillaMeter" class="gorilla-meter" hidden>GORILLA 0%</div>
        <button id="autoBtn" class="icon-btn system-tool" type="button">AUTO</button>
        <button id="skipBtn" class="icon-btn system-tool" type="button">SKIP</button>
        <button id="logBtn" class="icon-btn system-tool" type="button">LOG</button>
        <button id="menuBtn" class="icon-btn system-tool" type="button">MENU</button>
        <button id="collectionBtn" class="icon-btn" type="button">END</button>
        <button id="homeBtn" class="icon-btn" type="button" hidden>HOME</button>
      </div>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>
    <div id="modalLayer" class="modal-layer" hidden></div>
    <div class="prototype-tag">KUNIO STORY V2.0.2</div>
  </div>

  <script src="./text.js?v=2.0.2"></script>
  <script src="./game-config.js?v=2.0.2"></script>
  <script src="./scene-config.js?v=2.0.2"></script>
  <script src="./story-flow.js?v=2.0.2"></script>
  <script src="./game.js?v=2.0.2"></script>
</body>
</html>
